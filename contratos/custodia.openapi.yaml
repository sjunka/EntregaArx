openapi: 3.1.0
info:
  title: Custodia documental (MS-04)
  version: 0.9.0
  description: >
    Documentos del ciudadano afiliado. Realiza HU-02 (RF-09.1, RNF-10, RNF-11) y HU-03
    (RF-02.2, RF-02.3, RNF-24, RI-06) y HU-04 (RF-06.6, RF-02.5, RI-01, RNF-21) y HU-05 (RF-03.2, RF-03.3) y HU-06 (RF-02.7, RNF-01) y HU-07 (RI-08) y HU-08 (RF-04.1) y HU-09 (RF-03.3, RF-03.5, RNF-22): todas las rutas
    salvo /salud exigen un Bearer JWT del emisor OIDC con audiencia `custodia` y `azp: portal`;
    sin firma válida, de otro emisor, de otra audiencia o vencido responde 401. Cada ciudadano
    solo ve su Carpeta. El binario nunca pasa por este servicio: sube directo al almacén por una
    URL prefirmada de 5 minutos (RI-06) y la custodia solo recibe metadatos (cuerpos de 2 KB).
    Las rutas `/interno/*` son de la interoperabilidad (MS-07): exigen un token de servicio
    (client credentials, `azp: interoperabilidad`); un token de ciudadano recibe 403.
servers:
  - url: http://localhost:8083
security:
  - bearer: []
paths:
  /documentos:
    get:
      operationId: listarDocumentos
      summary: Lista los documentos Cargados de la Carpeta del titular
      description: >
        Lectura directa de la custodia. La SPA consulta y busca en el índice de carpeta (MS-05,
        `indice.openapi.yaml`); esta ruta queda para la conciliación.
      responses:
        '200':
          description: Documentos del titular, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
    post:
      operationId: registrarDocumento
      summary: Registra un Temporal pendiente y entrega la URL PUT prefirmada de 5 minutos
      description: >
        Valida título, formato (PDF, JPG o PNG), tamaño (10 MB) y cuota (20 Temporales y 200 MB)
        antes de emitir la URL. No hay clave por documento: el objeto se llama `{cédula}/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, tamano]
              properties:
                titulo: { type: string, minLength: 1, maxLength: 120 }
                tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                tamano: { type: integer, minimum: 1, maximum: 10485760, description: Bytes }
      responses:
        '201':
          description: Pendiente de carga
          content:
            application/json:
              schema:
                type: object
                required: [id, urlCarga]
                properties:
                  id: { type: string, format: uuid }
                  urlCarga: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '415': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/confirmacion:
    post:
      operationId: confirmarCarga
      summary: Verifica el objeto subido y deja el documento Cargado
      description: >
        Compara tamaño y tipo con lo declarado y calcula el SHA-256 del objeto. Si no coinciden
        borra el objeto y responde 422. Es idempotente: confirmar un Cargado lo devuelve igual.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Documento Cargado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/autenticacion:
    post:
      operationId: autenticarDocumento
      summary: Pide a GovCarpeta autenticar un Temporal Cargado
      description: >
        Solo el titular puede pedirlo; otro usuario, o un documento inexistente, recibe 403.
        A GovCarpeta viaja una URL de lectura de 15 minutos, nunca el contenido (RI-01). Autenticado
        es una marca, no un estado: el documento sigue Cargado, sigue siendo Temporal y sigue
        consumiendo cuota. Pedirlo de nuevo devuelve la constancia ya guardada.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Documento con la constancia de GovCarpeta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/descarga:
    get:
      operationId: descargarDocumento
      summary: Entrega una URL prefirmada de lectura de 60 segundos y registra el acceso
      description: >
        RF-02.7. Solo el titular y solo documentos que están en su Carpeta (Temporal cargado o
        sustituido, Certificado vigente). La URL trae `Content-Disposition: attachment`. Antes de
        firmar comprueba que el almacén responde; si no, 503 y no se registra ningún acceso. Cada
        URL entregada publica `acceso.registrado` (contratos/eventos) hacia la auditoría de MS-02.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: URL de lectura de corta vida
          content:
            application/json:
              schema:
                type: object
                required: [url, venceEn]
                properties:
                  url: { type: string, format: uri }
                  venceEn: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /documentos/{id}:
    delete:
      operationId: eliminarDocumento
      summary: Elimina un Temporal propio
      description: >
        Solo los Temporales se pueden eliminar (RF-02.10): quedan Eliminados, salen de la cuota y su
        objeto se borra. Un Certificado se custodia a perpetuidad y sin alteración: responde 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /interno/certificados:
    post:
      operationId: registrarCertificado
      summary: Registra un Certificado recibido de una entidad (MS-07)
      description: >
        Idempotente por (emisor, idExterno): un reenvío devuelve el mismo documento con 200 y no lo
        duplica. Con `firmaValida: false` el Certificado queda Rechazado y no se emite URL. Con firma
        válida queda Recibido y devuelve la URL PUT de 5 minutos al bucket de certificados.
        Un Certificado no consume cuota (RNF-24).
      security: [{ servicio: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emisor, idExterno, cedula, titulo, tipo, tamano, sha256, firmaValida]
              properties:
                emisor: { type: string, minLength: 1, maxLength: 80 }
                idExterno: { type: string, minLength: 1, maxLength: 120 }
                cedula: { type: string, pattern: '^[0-9]{6,10}$' }
                titulo: { type: string, minLength: 1, maxLength: 120 }
                tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                tamano: { type: integer, minimum: 1, maximum: 10485760 }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                firmaValida: { type: boolean }
                motivo: { type: string, description: Por qué la firma no verificó }
      responses:
        '201':
          description: Registrado como Recibido (con URL) o como Rechazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroCertificado' }
        '200':
          description: Reenvío idempotente del mismo (emisor, idExterno)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroCertificado' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /interno/certificados/{id}/verificacion:
    post:
      operationId: verificarCertificado
      summary: Verifica el objeto subido y deja el Certificado Vigente
      description: >
        Compara tamaño, tipo y SHA-256 con lo declarado. Coinciden: Recibido, Verificado, Vigente,
        y el Temporal equivalente del mismo titular (mismo título normalizado, el más antiguo
        Cargado) pasa a Sustituido enlazado al Certificado. No coinciden: Rechazado y se borra el
        objeto. Si el archivo aún no llegó responde 409 y sigue Recibido. `cambio` es verdadero
        solo la primera vez que queda Vigente, para que el evento se publique una vez.
      security: [{ servicio: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado resultante
          content:
            application/json:
              schema:
                type: object
                required: [documento, cambio]
                properties:
                  documento: { $ref: '#/components/schemas/Documento' }
                  cambio: { type: boolean }
                  sustituyeA: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /interno/lecturas:
    post:
      operationId: leerParaTercero
      summary: URL de lectura de 5 minutos para un tercero autorizado (RI-08)
      description: >
        Solo la interoperabilidad. Antes de firmar, la custodia pregunta a MS-06 si el titular tiene una
        autorización vigente para ese documento y ese tercero (`entidad:{id}` o `correo:{dirección}`). Sin
        autorización, revocada o vencida: 403 y no se firma nada. Si MS-06 no responde: 503, falla cerrada.
        Cada URL entregada publica `acceso.registrado` con actor tercero. Un documento que no está en la
        Carpeta responde 404 sin consultar a MS-06.
      security: [{ servicio: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentoId, tercero]
              properties:
                documentoId: { type: string, format: uuid }
                tercero: { type: string, maxLength: 254 }
      responses:
        '200':
          description: URL de lectura
          content:
            application/json:
              schema:
                type: object
                required: [url, venceEn, titulo]
                properties:
                  url: { type: string, format: uri }
                  venceEn: { type: string, format: date-time }
                  titulo: { type: string }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /interno/comprobacion:
    post:
      operationId: comprobarDocumentos
      summary: Qué documentos de una lista son del titular y están en su Carpeta (HU-08)
      description: >
        Solo la interoperabilidad. Antes de conceder un envío comprueba que cada documento es del titular y está en su
        Carpeta; devuelve solo los que cumplen, en el orden pedido, y no revela que otros existan.
      security: [{ servicio: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cedula, documentos]
              properties:
                cedula: { type: string, pattern: '^[0-9]{6,10}$' }
                documentos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Los documentos que sí son del titular
          content:
            application/json:
              schema:
                type: object
                required: [documentos]
                properties:
                  documentos:
                    type: array
                    items:
                      type: object
                      required: [id, titulo]
                      properties:
                        id: { type: string, format: uuid }
                        titulo: { type: string }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /interno/traslados/documentos:
    post:
      operationId: recibirDocumentoTrasladado
      summary: Recibe un documento de un Traslado de entrada descargándolo de la URL del origen (HU-09)
      description: >
        Solo la interoperabilidad. La custodia descarga el archivo de `url` (solo https, nunca direcciones privadas, sin
        redirecciones y con 10 MB de tope), calcula su tamaño y SHA-256 y reconoce el tipo por su contenido (PDF, JPG o
        PNG; otro tipo: 422). El formato de traslado del curso no declara esos datos (ADR-0027). Lo guarda: el Temporal queda Cargado y el Certificado Vigente con su emisor original, en su
        bucket. No consume cuota. Idempotente por (`operador`, `idExterno`): un reintento devuelve el documento que ya existe
        con 200 y no lo descarga otra vez. Fallo del origen: 502 y no se guarda nada; dirección no permitida: 422; almacén
        caído: 503. Publica `documento.cargado`.
      security: [{ servicio: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operador, idExterno, cedula, titulo, clase, url]
              properties:
                operador: { type: string }
                idExterno: { type: string, description: Identificador del documento en el operador de origen }
                cedula: { type: string, pattern: '^[0-9]{6,10}$' }
                titulo: { type: string, maxLength: 120 }
                clase: { type: string, enum: [temporal, certificado] }
                emisor: { type: string, description: Obligatorio en los Certificados }
                url: { type: string, format: uri, maxLength: 2000 }
      responses:
        '201':
          description: Recibido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoTrasladado' }
        '200':
          description: Ya lo tenía (reintento idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoTrasladado' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /interno/traslados/{cedula}:
    delete:
      operationId: descartarTraslado
      summary: El Traslado falló; descarta lo que llegó de ese origen para ese titular
      description: Borra los documentos y sus archivos y publica `documento.eliminado` por cada uno. No toca lo que el ciudadano subió ni lo de otro origen. Idempotente.
      security: [{ servicio: [] }]
      parameters:
        - { name: cedula, in: path, required: true, schema: { type: string } }
        - { name: operador, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Descartados
          content:
            application/json:
              schema:
                type: object
                required: [descartados]
                properties:
                  descartados: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /interno/salida/{cedula}/congelacion:
    post:
      operationId: congelarCarpeta
      summary: Congela la Carpeta y entrega una URL de lectura por documento para el operador destino (HU-13)
      description: >
        Deja la Carpeta en solo lectura: subir, confirmar, autenticar y eliminar responden 409 y un Certificado nuevo también.
        Devuelve una URL prefirmada de solo lectura por cada documento de la Carpeta (`TRASLADO_URL_SEGUNDOS`, 24 horas por
        defecto): el destino nunca recibe credenciales del almacén (RI-06) y nada de esto llega a GovCarpeta (RI-01). No es un
        acceso de tercero, no se audita. Idempotente: repetirlo da URL nuevas.
      security: [{ servicio: [] }]
      parameters:
        - { name: cedula, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '200':
          description: Carpeta congelada
          content:
            application/json:
              schema:
                type: object
                required: [documentos]
                properties:
                  documentos:
                    type: array
                    items:
                      type: object
                      required: [id, titulo, clase, url]
                      properties:
                        id: { type: string, format: uuid }
                        titulo: { type: string }
                        clase: { type: string, enum: [temporal, certificado] }
                        url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: reabrirCarpeta
      summary: El destino rechazó el traslado; la Carpeta vuelve a lectura y escritura
      security: [{ servicio: [] }]
      parameters:
        - { name: cedula, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '200': { description: Reabierta }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /interno/salida/{cedula}:
    delete:
      operationId: cerrarCarpeta
      summary: El destino confirmó (req_status 1); borra los documentos y sus archivos (HU-13)
      description: >
        Solo con la Carpeta congelada por un traslado de salida: sin él, y con documentos, responde 409 y no borra nada.
        No publica un evento por documento: MS-07 publica un solo `ciudadano.trasladado`. Idempotente.
      security: [{ servicio: [] }]
      parameters:
        - { name: cedula, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '200':
          description: Borrada
          content:
            application/json:
              schema:
                type: object
                required: [borrados]
                properties:
                  borrados: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /cuota:
    get:
      operationId: consultarCuota
      summary: Cuota de Temporales del titular
      responses:
        '200':
          description: Uso y límites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuota' }
        '401': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      security: []
      summary: Chequeo de salud
      responses:
        '200':
          description: Servicio sano
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, const: ok }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    servicio: { type: http, scheme: bearer, bearerFormat: JWT, description: Token client credentials de la interoperabilidad }
  schemas:
    Documento:
      type: object
      required: [id, titulo, clase, estado, tipo, tamano, creado]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        clase: { type: string, enum: [temporal, certificado] }
        estado:
          type: string
          description: >
            Temporal: cargado, sustituido, eliminado. Certificado: recibido, verificado, vigente,
            rechazado, retirado. La Carpeta del titular solo muestra Temporales cargado o sustituido
            y Certificados vigente.
          enum: [cargado, sustituido, eliminado, recibido, verificado, vigente, rechazado, retirado]
        emisor: { type: string, description: Entidad que firmó el Certificado }
        sustituidoPor: { type: string, format: uuid, description: Certificado que reemplazó a este Temporal }
        motivo: { type: string, description: Por qué quedó Rechazado el Certificado; solo en las rutas internas }
        titular: { type: string, description: Cédula del titular; solo en las rutas internas }
        tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        tamano: { type: integer }
        sha256: { type: string, description: Huella del archivo calculada al confirmar la carga }
        autenticacion:
          type: object
          description: Constancia de GovCarpeta; ausente mientras el Temporal no esté Autenticado
          required: [fecha, respuesta]
          properties:
            fecha: { type: string, format: date-time }
            respuesta: { type: string, description: 'Texto del centralizador: un sello suyo, no un certificado (B-03)' }
        creado: { type: string, format: date-time }
    DocumentoTrasladado:
      type: object
      required: [documento]
      properties:
        documento: { $ref: '#/components/schemas/Documento' }
    RegistroCertificado:
      type: object
      required: [documento, existente]
      properties:
        documento: { $ref: '#/components/schemas/Documento' }
        existente: { type: boolean }
        urlCarga: { type: string, format: uri, description: Solo si el Certificado está Recibido }
    Cuota:
      type: object
      required: [documentos, bytes]
      properties:
        documentos:
          type: object
          required: [usados, maximo]
          properties: { usados: { type: integer }, maximo: { type: integer, const: 20 } }
        bytes:
          type: object
          required: [usados, maximo]
          properties: { usados: { type: integer }, maximo: { type: integer, const: 209715200 } }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
