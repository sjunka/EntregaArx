# Mi Carpeta Segura en local: docker compose up -d --build
# SPA 4173 · emisor OIDC 8081 · afiliación 8082 · custodia 8083 · pasarela 8084 · MinIO 9000 (consola 9001) · GovCarpeta simulado 8090
name: mcs

x-migracion: &migracion
  depends_on: { postgres: { condition: service_healthy } }
  restart: "no"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_CLAVE:?copia .env.example a .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-bases.sql:/docker-entrypoint-initdb.d/init-bases.sql:ro
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      retries: 20

  # Almacén de objetos: el navegador sube y baja los binarios directo, por URL prefirmada (RI-06).
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?copia .env.example a .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?copia .env.example a .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  bucket:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
             mc mb --ignore-existing local/mcs-documentos"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  migrar-identidad:
    <<: *migracion
    build: ./identidad
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/identidad
      USUARIO_DEMO_CLAVE: ${USUARIO_DEMO_CLAVE:?copia .env.example a .env}

  identidad:
    build: ./identidad
    restart: unless-stopped
    depends_on: { migrar-identidad: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/identidad
      # iss que ve el navegador; los servicios entran por la red interna (http://identidad:8080).
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      PORTAL_REDIRECTS: http://localhost:4173/*,http://localhost:5173/*
      ORIGENES: http://localhost:4173,http://localhost:5173
      KC_AFILIACION_SECRETO: ${KC_AFILIACION_SECRETO:?copia .env.example a .env}
    ports: ["8081:8080"]

  # Doble de GovCarpeta: compose nunca escribe en el real (B-06, GOVCARPETA_ESCRITURA).
  govcarpeta:
    build: ./infra/govcarpeta-stub
    restart: unless-stopped
    ports: ["8090:8080"]

  pasarela:
    build: ./servicios/pasarela
    restart: unless-stopped
    depends_on: { govcarpeta: { condition: service_healthy } }
    environment:
      GOVCARPETA_URL: ${GOVCARPETA_URL:-http://govcarpeta:8080}
      GOVCARPETA_ESCRITURA: ${GOVCARPETA_ESCRITURA:-0}
      OPERADOR_ID: ${OPERADOR_ID:-mcs-local}
      OPERADOR_NOMBRE: Mi Carpeta Segura
      # MinIO local no tiene TLS; en la nube la pasarela exige https.
      URL_SOLO_HTTPS: "false"
    ports: ["8084:8080"]

  migrar-afiliacion:
    <<: *migracion
    build: ./servicios/afiliacion
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/afiliacion

  afiliacion:
    build: ./servicios/afiliacion
    restart: unless-stopped
    depends_on:
      migrar-afiliacion: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
      pasarela: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/afiliacion
      PASARELA_URL: http://pasarela:8080
      KEYCLOAK_URL: http://identidad:8080
      KEYCLOAK_SECRETO: ${KC_AFILIACION_SECRETO}
      # En local todas las pruebas salen de la misma IP; en la nube queda el valor por defecto (5).
      LIMITE_REGISTROS_HORA: 1000
      ORIGENES: http://localhost:4173,http://localhost:5173
    ports: ["8082:8080"]

  migrar-custodia:
    <<: *migracion
    build: ./servicios/custodia
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/custodia

  custodia:
    build: ./servicios/custodia
    restart: unless-stopped
    depends_on:
      migrar-custodia: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
      pasarela: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/custodia
      PASARELA_URL: http://pasarela:8080
      # iss que ve el navegador; las llaves se leen por la red interna.
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
      S3_ENDPOINT: http://minio:9000
      # Las URL prefirmadas se firman con el host que ve el navegador.
      S3_ENDPOINT_PUBLICO: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: mcs-documentos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["8083:8080"]

  web:
    build:
      context: ./web
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/carpeta
        VITE_MCS_AFILIACION: http://localhost:8082
        VITE_MCS_CUSTODIA: http://localhost:8083
    restart: unless-stopped
    depends_on: { identidad: { condition: service_healthy } }
    ports: ["4173:80"]

volumes:
  pgdata:
  miniodata:
