openapi: 3.1.0
info:
  title: Custodia documental (MS-04)
  version: 0.3.0
  description: >
    Documentos del ciudadano afiliado. Realiza HU-02 (RF-09.1, RNF-10, RNF-11) y HU-03
    (RF-02.2, RF-02.3, RNF-24, RI-06) y HU-04 (RF-06.6, RF-02.5, RI-01, RNF-21): todas las rutas
    salvo /salud exigen un Bearer JWT del emisor OIDC con audiencia `custodia` y `azp: portal`;
    sin firma válida, de otro emisor, de otra audiencia o vencido responde 401. Cada ciudadano
    solo ve su Carpeta. El binario nunca pasa por este servicio: sube directo al almacén por una
    URL prefirmada de 5 minutos (RI-06) y la custodia solo recibe metadatos (cuerpos de 2 KB).
servers:
  - url: http://localhost:8083
security:
  - bearer: []
paths:
  /documentos:
    get:
      operationId: listarDocumentos
      summary: Lista los documentos Cargados de la Carpeta del titular
      responses:
        '200':
          description: Documentos del titular, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
    post:
      operationId: registrarDocumento
      summary: Registra un Temporal pendiente y entrega la URL PUT prefirmada de 5 minutos
      description: >
        Valida título, formato (PDF, JPG o PNG), tamaño (10 MB) y cuota (20 Temporales y 200 MB)
        antes de emitir la URL. No hay clave por documento: el objeto se llama `{cédula}/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, tamano]
              properties:
                titulo: { type: string, minLength: 1, maxLength: 120 }
                tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                tamano: { type: integer, minimum: 1, maximum: 10485760, description: Bytes }
      responses:
        '201':
          description: Pendiente de carga
          content:
            application/json:
              schema:
                type: object
                required: [id, urlCarga]
                properties:
                  id: { type: string, format: uuid }
                  urlCarga: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '415': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/confirmacion:
    post:
      operationId: confirmarCarga
      summary: Verifica el objeto subido y deja el documento Cargado
      description: >
        Compara tamaño y tipo con lo declarado y calcula el SHA-256 del objeto. Si no coinciden
        borra el objeto y responde 422. Es idempotente: confirmar un Cargado lo devuelve igual.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Documento Cargado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /documentos/{id}/autenticacion:
    post:
      operationId: autenticarDocumento
      summary: Pide a GovCarpeta autenticar un Temporal Cargado
      description: >
        Solo el titular puede pedirlo; otro usuario, o un documento inexistente, recibe 403.
        A GovCarpeta viaja una URL de lectura de 15 minutos, nunca el contenido (RI-01). Autenticado
        es una marca, no un estado: el documento sigue Cargado, sigue siendo Temporal y sigue
        consumiendo cuota. Pedirlo de nuevo devuelve la constancia ya guardada.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Documento con la constancia de GovCarpeta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /cuota:
    get:
      operationId: consultarCuota
      summary: Cuota de Temporales del titular
      responses:
        '200':
          description: Uso y límites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuota' }
        '401': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      security: []
      summary: Chequeo de salud
      responses:
        '200':
          description: Servicio sano
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, const: ok }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Documento:
      type: object
      required: [id, titulo, clase, estado, tipo, tamano, creado]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        clase: { type: string, enum: [temporal] }
        estado: { type: string, enum: [cargado] }
        tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        tamano: { type: integer }
        sha256: { type: string, description: Huella del archivo calculada al confirmar la carga }
        autenticacion:
          type: object
          description: Constancia de GovCarpeta; ausente mientras el Temporal no esté Autenticado
          required: [fecha, respuesta]
          properties:
            fecha: { type: string, format: date-time }
            respuesta: { type: string, description: 'Texto del centralizador: un sello suyo, no un certificado (B-03)' }
        creado: { type: string, format: date-time }
    Cuota:
      type: object
      required: [documentos, bytes]
      properties:
        documentos:
          type: object
          required: [usados, maximo]
          properties: { usados: { type: integer }, maximo: { type: integer, const: 20 } }
        bytes:
          type: object
          required: [usados, maximo]
          properties: { usados: { type: integer }, maximo: { type: integer, const: 209715200 } }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
