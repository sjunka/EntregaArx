openapi: 3.1.0
info:
  title: Interoperabilidad (MS-07)
  version: 0.3.0
  description: >
    Recibe los documentos que emiten las entidades (HU-05: RF-03.2, RF-03.3, RNF-05) y las peticiones de
    documentos de las entidades al ciudadano (HU-07: RF-04.3, RF-04.4, RI-08) y el envío del ciudadano a una entidad
    sin operador por correo con enlaces temporales (HU-08: RF-04.1, RF-04.2, RF-03.4). Como no existe
    contrato MinTIC para esta interfaz (B-01), el operador define uno propio y lo dice aquí.
    La entidad se autentica firmando: cada solicitud lleva un JWS compacto (RS256 o ES256) cuyo
    `iss` es el emisor y cuyo payload repite `idExterno`, `cedula`, `titulo` y `sha256`; se verifica con
    la llave pública que el operador tiene registrada para ese emisor. El binario nunca viaja por
    este servicio (RI-06): la entidad lo sube con la URL PUT prefirmada de 5 minutos que recibe en el
    paso 1 y después confirma. El contenido tampoco pasa por GovCarpeta (RI-01).
servers:
  - url: http://localhost:8086
security: []
paths:
  /api/documentos:
    post:
      operationId: emitirDocumento
      summary: Paso 1. Anuncia un documento emitido, con su firma
      description: >
        Idempotente por (emisor, idExterno): un reenvío devuelve el mismo documento con 200 y no lo
        duplica. Firma inválida: el Certificado queda Rechazado, no entra a la Carpeta y la
        entidad recibe el motivo con 422 (`estado: rechazado`). Un emisor sin llave registrada
        recibe 403 y no se guarda nada. Un destinatario que no esté afiliado a este operador
        recibe 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Emision' }
      responses:
        '201':
          description: Recibido. Sube el archivo a `urlCarga` y confirma.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recibido' }
        '200':
          description: Reenvío idempotente; mismo documento y estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recibido' }
        '403': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /api/documentos/{id}/confirmacion:
    post:
      operationId: confirmarEmision
      summary: Paso 2. La entidad terminó de subir el archivo
      description: >
        La custodia compara tamaño, tipo y SHA-256 con lo firmado. Coinciden: Verificado y Vigente,
        entra a la Carpeta y se publica el evento de recepción. No coinciden: Rechazado (422).
        Si el archivo aún no llegó responde 409 y se puede reintentar. Confirmar de nuevo un
        Vigente responde 200 sin duplicar el evento.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Vigente
          content:
            application/json:
              schema:
                type: object
                required: [id, estado]
                properties:
                  id: { type: string, format: uuid }
                  estado: { type: string, const: vigente }
                  sustituyeA: { type: string, format: uuid, description: Temporal equivalente que pasó a Sustituido }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /api/peticiones:
    post:
      operationId: pedirDocumentos
      summary: La entidad pide documentos a un ciudadano de este operador (RF-04.3)
      description: >
        La petición va firmada como las emisiones (ADR-0017): el JWS repite `idExterno`, `cedula`,
        `proposito` y `pedidos` (la lista de títulos). Firma que no verifica o no cubre un campo: 401.
        Entidad sin llave registrada: 403. Destinatario no afiliado a este operador: 422. Idempotente por
        (entidad, idExterno): un reenvío devuelve la misma petición con 200. La petición queda pendiente
        en MS-06 hasta que el ciudadano la responda; este servicio no la guarda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Peticion' }
      responses:
        '201':
          description: Petición registrada y pendiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeticionEstado' }
        '200':
          description: Reenvío idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeticionEstado' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /api/peticiones/{id}:
    get:
      operationId: recogerDocumentos
      summary: La entidad recoge lo que el ciudadano autorizó
      description: >
        La entidad se autentica con un JWS de vida corta (`{ iss, iat, exp }`, máximo 5 minutos) firmado con su
        llave registrada, en `Authorization: Bearer`. Solo ve sus propias peticiones. Pendiente o rechazada:
        `documentos` vacío y ningún detalle de la carpeta. Atendida: solo los documentos autorizados que siguen
        vigentes, cada uno con una URL de lectura de 5 minutos que firma la custodia después de que MS-06 decide
        (RI-08); cada consulta queda en la bitácora de accesos (MS-02). Una autorización revocada deja de entregarse.
      security: [{ entidad: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado de la petición y documentos autorizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recogida' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /envios:
    post:
      operationId: enviarAEntidad
      summary: El ciudadano envía documentos a una entidad no afiliada por correo (RF-04.1, RF-04.2)
      description: >
        Exige un Bearer JWT del emisor OIDC con audiencia `interoperabilidad` y `azp: portal`. El envío pasa por la
        decisión de autorizaciones: MS-06 concede al correo (`correo:{dirección}`) la lectura de esos documentos, con la
        vigencia de 72 horas. El correo lleva un enlace temporal por documento, nunca el archivo adjunto (B-14). Cada
        enlace se resuelve en `/api/enlaces` y la custodia vuelve a consultar a MS-06 en cada apertura. Si el correo no
        sale, el envío queda `pendiente` (202) y se reintenta con retroceso exponencial sin duplicar el envío, la
        autorización ni el correo; tras 5 intentos queda `fallido`. Al entregarse se publica `envio.entregado`, que MS-09
        confirma al ciudadano y MS-02 registra en la bitácora. Con la cabecera `Idempotency-Key`, repetir la solicitud
        devuelve el mismo envío con 200. Un documento que no es del titular o no está en su Carpeta responde 422 sin
        conceder ni enviar nada.
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, pattern: '^[\\w-]{1,64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, documentos]
              properties:
                correo: { type: string, format: email, maxLength: 254, description: Correo de la entidad destinataria }
                documentos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: El correo salió hacia la entidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envio' }
        '202':
          description: El correo no salió todavía; se reintenta solo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envio' }
        '200':
          description: Repetición con la misma `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envio' }
        '401': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
    get:
      operationId: listarEnvios
      summary: Envíos del titular, del más reciente al más antiguo (hasta 50)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Envíos con destinatario, documentos y estado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Envio' }
        '401': { $ref: '#/components/responses/Problema' }
  /api/enlaces/{envioId}/{documentoId}:
    get:
      operationId: abrirEnlace
      summary: El enlace del correo; redirige a una URL de lectura de 5 minutos
      description: >
        Sin sesión: la credencial es la firma `f` del enlace (HMAC del envío y el documento), que solo sirve para ese
        documento de ese envío. Antes de redirigir la custodia consulta a MS-06 (RI-08) y registra el acceso. Firma
        inválida o envío no entregado: 404. Pasadas las 72 horas: 410. Autorización retirada: 403. Custodia o
        autorizaciones caídas: 503.
      security: []
      parameters:
        - { name: envioId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: f, in: query, required: true, schema: { type: string, minLength: 32, maxLength: 32 } }
      responses:
        '302':
          description: URL prefirmada de lectura en `Location`
          headers:
            Location: { schema: { type: string, format: uri } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '410': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      summary: Chequeo de salud
      responses:
        '200':
          description: Servicio sano
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, const: ok }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    entidad: { type: http, scheme: bearer, bearerFormat: JWS, description: 'JWS compacto RS256 o ES256 con { iss, iat, exp }, vida máxima de 5 minutos' }
  schemas:
    Envio:
      type: object
      required: [id, correo, documentos, estado, creado, venceEn]
      properties:
        id: { type: string, format: uuid }
        correo: { type: string, format: email }
        documentos:
          type: array
          items:
            type: object
            required: [id, titulo]
            properties:
              id: { type: string, format: uuid }
              titulo: { type: string }
        estado: { type: string, enum: [pendiente, entregado, fallido] }
        creado: { type: string, format: date-time }
        venceEn: { type: string, format: date-time, description: 'Fin de la vigencia de los enlaces (72 h)' }
        entregadoEn: { type: string, format: date-time }
    Peticion:
      type: object
      required: [emisor, idExterno, cedula, proposito, documentos, firma]
      properties:
        emisor: { type: string, description: Entidad que pide; es el `iss` de la firma }
        idExterno: { type: string, maxLength: 120, description: Identificador de la petición en la entidad }
        cedula: { type: string, pattern: '^[0-9]{6,10}$' }
        proposito: { type: string, maxLength: 200, description: Para qué se piden los documentos; el ciudadano lo lee antes de decidir }
        documentos:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [titulo]
            properties:
              titulo: { type: string, maxLength: 120, description: 'Qué documento se pide, en palabras' }
        firma: { type: string, description: 'JWS compacto cuyo payload es { iss, idExterno, cedula, proposito, pedidos: [títulos] }' }
    PeticionEstado:
      type: object
      required: [id, estado]
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [pendiente] }
    Recogida:
      type: object
      required: [id, estado, documentos]
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [pendiente, atendida, rechazada] }
        documentos:
          type: array
          items:
            type: object
            required: [id, titulo, url, venceEn]
            properties:
              id: { type: string, format: uuid }
              titulo: { type: string }
              url: { type: string, format: uri, description: URL prefirmada de lectura de 5 minutos }
              venceEn: { type: string, format: date-time }
    Emision:
      type: object
      required: [emisor, idExterno, cedula, titulo, tipo, tamano, sha256, firma]
      properties:
        emisor: { type: string, description: 'Identificador de la entidad; es el mismo `iss` de la firma' }
        idExterno: { type: string, maxLength: 120, description: Identificador del documento en la entidad; hace idempotente el envío }
        cedula: { type: string, pattern: '^[0-9]{6,10}$', description: Titular al que va dirigido }
        titulo: { type: string, minLength: 1, maxLength: 120 }
        tipo: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        tamano: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Huella del archivo que se subirá }
        firma:
          type: string
          description: JWS compacto con payload {idExterno, cedula, titulo, sha256} e `iss` igual al emisor
    Recibido:
      type: object
      required: [id, estado]
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [recibido, vigente] }
        urlCarga: { type: string, format: uri, description: URL PUT prefirmada de 5 minutos; solo mientras esté Recibido }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              id: { type: string, format: uuid, description: Documento que quedó Rechazado }
              estado: { type: string, description: rechazado }
