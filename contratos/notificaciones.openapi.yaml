openapi: 3.1.0
info:
  title: Notificaciones (MS-09)
  version: 0.1.0
  description: >
    Avisa al ciudadano por el canal que elija (HU-05: RF-05.1, RNF-05). Consume `documento.recibido` y
    `ciudadano.afiliado` del bus (contratos/eventos). Las rutas de este archivo son la excepción a
    «sin API síncrona» que documenta el ADR-0016: solo sirven a la SPA para que el ciudadano elija
    canal y vea sus avisos. Exigen un Bearer JWT del emisor OIDC con audiencia `notificaciones` y
    `azp: portal`; cada ciudadano solo ve lo suyo.
servers:
  - url: http://localhost:8087
security:
  - bearer: []
paths:
  /preferencias:
    get:
      operationId: consultarPreferencias
      summary: Canales elegidos y destinos de contacto (enmascarados)
      responses:
        '200':
          description: Preferencias del titular
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferencias' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarPreferencias
      summary: Elige por qué canales recibir avisos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canales]
              properties:
                canales:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [correo, sms] }
      responses:
        '200':
          description: Preferencias guardadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferencias' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /notificaciones:
    get:
      operationId: listarNotificaciones
      summary: Últimos avisos del titular, del más reciente al más antiguo
      description: >
        Historial por canal. Si todos los canales fallan, el aviso queda aquí con estado `fallido`
        y se levanta una alerta operativa.
      responses:
        '200':
          description: Hasta 50 avisos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      security: []
      summary: Chequeo de salud
      responses:
        '200':
          description: Servicio sano
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, const: ok }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Preferencias:
      type: object
      required: [canales, correo, telefono]
      properties:
        canales:
          type: array
          items: { type: string, enum: [correo, sms] }
        correo: { type: string, description: 'Correo de contacto enmascarado, por ejemplo an***@correo.co' }
        telefono: { type: string, description: 'Celular enmascarado, por ejemplo 300***4567' }
    Notificacion:
      type: object
      required: [canal, estado, asunto, creado]
      properties:
        canal: { type: string, enum: [correo, sms, ninguno] }
        estado: { type: string, enum: [enviado, fallido] }
        asunto: { type: string }
        detalle: { type: string }
        creado: { type: string, format: date-time }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
