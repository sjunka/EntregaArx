openapi: 3.1.0
info:
  title: Custodia documental (MS-04)
  version: 0.1.0
  description: >
    Documentos del ciudadano afiliado. Realiza HU-02 (RF-09.1, RNF-10, RNF-11): todas las rutas
    salvo /salud exigen un Bearer JWT del emisor OIDC con audiencia `custodia` y `azp: portal`;
    sin firma válida, de otro emisor, de otra audiencia o vencido responde 401. Cada ciudadano
    solo ve su Carpeta.
servers:
  - url: http://localhost:8083
security:
  - bearer: []
paths:
  /documentos:
    get:
      operationId: listarDocumentos
      summary: Lista los documentos de la Carpeta del titular
      responses:
        '200':
          description: Documentos del titular, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      security: []
      summary: Chequeo de salud
      responses:
        '200':
          description: Servicio sano
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, const: ok }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Documento:
      type: object
      required: [id, titulo, creado]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        creado: { type: string, format: date-time }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
