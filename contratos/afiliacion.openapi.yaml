openapi: 3.1.0
info:
  title: Afiliación (MS-03)
  version: 0.3.0
  description: >
    Registro de ciudadanos con afiliación única contra GovCarpeta. Realiza HU-01
    (RF-01.1, RF-01.2, RF-01.3, RF-01.5, RI-03). La verificación de identidad contra la
    Registraduría es simulada (B-06).
servers:
  - url: http://localhost:8082
security: [] # registro anónimo: el ciudadano aún no tiene cuenta
paths:
  /ciudadanos:
    post:
      operationId: registrarCiudadano
      summary: Registra y afilia a un ciudadano
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
      responses:
        '201':
          description: Afiliado; devuelve la cuenta institucional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Afiliado'
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      summary: Chequeo de salud
      responses:
        '200': { description: Servicio sano }
components:
  schemas:
    Registro:
      type: object
      required: [cedula, nombre, apellido, direccion, correoContacto, telefono, clave]
      additionalProperties: false
      properties:
        cedula: { type: string, pattern: '^[0-9]{6,10}$' }
        nombre: { type: string, minLength: 1, maxLength: 60 }
        apellido: { type: string, minLength: 1, maxLength: 60 }
        direccion: { type: string, minLength: 1, maxLength: 120 }
        correoContacto: { type: string, format: email }
        telefono: { type: string, pattern: '^3[0-9]{9}$', description: 'Celular colombiano de 10 dígitos (RF-01.1). No viaja a GovCarpeta.' }
        clave: { type: string, minLength: 12, maxLength: 64, writeOnly: true }
    Afiliado:
      type: object
      required: [cedula, cuenta, estado, identidad]
      properties:
        cedula: { type: string }
        cuenta: { type: string, format: email, description: 'nombre.apellido.NNNNN@carpetacolombia.co' }
        estado: { type: string, enum: [afiliado] }
        identidad: { type: string, enum: [simulada], description: 'Verificación de identidad simulada (B-06)' }
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
