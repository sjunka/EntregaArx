openapi: 3.1.0
info:
  title: Pasarela del centralizador (MS-08)
  version: 0.4.0
  description: >
    Capa anticorrupción sobre GovCarpeta: timeout de 8 s, reintento solo en lecturas y circuit
    breaker. Nunca acepta contenido documental (RI-01, RD-15, RNF-21: cuerpos de 2 KB como máximo).
    Solo escribe en el GovCarpeta real con GOVCARPETA_ESCRITURA=1.
servers:
  - url: http://localhost:8084
security: [] # servicio interno: solo alcanzable desde la red del operador
paths:
  /centralizador/ciudadanos/{id}:
    get:
      operationId: consultarAfiliacion
      summary: Consulta la afiliación (validateCitizen)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '200':
          description: Resultado normalizado
          content:
            application/json:
              schema:
                type: object
                required: [afiliado, operador]
                properties:
                  afiliado: { type: boolean }
                  operador: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: desafiliarCiudadano
      summary: Da de baja al ciudadano de este operador (unregisterCitizen), al empezar un Traslado de salida (HU-13)
      description: >
        Escritura: solo viajan id y operador (RI-01). 200, 201 y 204 de GovCarpeta dejan libre al ciudadano. Sin
        GOVCARPETA_ESCRITURA=1 en el GovCarpeta real no se envía nada y responde 503.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]{6,10}$' } }
      responses:
        '200':
          description: Dado de baja
          content:
            application/json:
              schema:
                type: object
                properties:
                  desafiliado: { type: boolean }
        '400': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /centralizador/ciudadanos:
    post:
      operationId: registrarCiudadano
      summary: Registra al ciudadano con este operador (registerCitizen)
      description: Solo viajan id, nombre, dirección, correo institucional y operador (RF-06.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, nombre, direccion, correo]
              properties:
                id: { type: string, pattern: '^[0-9]{6,10}$' }
                nombre: { type: string }
                direccion: { type: string }
                correo: { type: string, format: email }
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrado: { type: boolean }
        '400': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /centralizador/operadores:
    get:
      operationId: listarOperadores
      summary: Directorio de operadores (getOperators), para el Traslado de salida (HU-13)
      description: Solo los que publican `transferAPIURL` pueden recibir un traslado (B-16); los demás llevan null.
      responses:
        '200':
          description: Operadores del centralizador
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nombre, transferAPIURL]
                  properties:
                    id: { type: string }
                    nombre: { type: string }
                    transferAPIURL: { type: [string, 'null'] }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /centralizador/documentos/autenticacion:
    put:
      operationId: autenticarDocumento
      summary: Pide a GovCarpeta autenticar un documento por su URL prefirmada (authenticateDocument)
      description: >
        Solo viajan la cédula, la URL de lectura y el título (RI-01, RNF-21): nunca el contenido.
        La URL debe ser https (compose la relaja para MinIO local). Escribe en GovCarpeta, así que
        con el real exige GOVCARPETA_ESCRITURA=1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idCiudadano, url, titulo]
              properties:
                idCiudadano: { type: string, pattern: '^[0-9]{6,10}$' }
                url: { type: string, format: uri, pattern: '^https://' }
                titulo: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Respuesta del centralizador
          content:
            application/json:
              schema:
                type: object
                required: [autenticado, respuesta]
                properties:
                  autenticado: { type: boolean }
                  respuesta: { type: string }
        '400': { $ref: '#/components/responses/Problema' }
        '413': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /salud:
    get:
      operationId: salud
      summary: Chequeo de salud
      responses:
        '200': { description: Servicio sano }
components:
  responses:
    Problema:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
