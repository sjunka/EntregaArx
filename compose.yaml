# Mi Carpeta Segura en local: docker compose up -d --build
# SPA 4173 · emisor OIDC 8081 · afiliación 8082 · custodia 8083 · pasarela 8084 · Schema Registry 8085
# interoperabilidad 8086 · notificaciones 8087 · entidad simulada 8088 · MinIO 9000 (consola 9001) · Mailpit 8025 · GovCarpeta simulado 8090
# índice de carpeta 8091 · auditoría 8092 · autorizaciones 8093 · operador de origen simulado 8094
name: mcs

x-migracion: &migracion
  depends_on: { postgres: { condition: service_healthy } }
  restart: "no"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_CLAVE:?copia .env.example a .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-bases.sql:/docker-entrypoint-initdb.d/init-bases.sql:ro
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      retries: 20

  # Bus de eventos (AD-05): Kafka en modo KRaft, un solo nodo, y Schema Registry con los esquemas de contratos/eventos.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null
      interval: 5s
      retries: 30

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    depends_on: { kafka: { condition: service_healthy } }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8085:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      retries: 30

  esquemas:
    image: node:22-alpine
    restart: "no"
    depends_on: { schema-registry: { condition: service_healthy } }
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./infra/registrar-esquemas.mjs:/app/registrar-esquemas.mjs:ro
      - ./contratos/eventos:/app/eventos:ro
    command: ["node", "/app/registrar-esquemas.mjs", "/app/eventos"]

  # Almacén de objetos: el navegador sube y baja los binarios directo, por URL prefirmada (RI-06).
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?copia .env.example a .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?copia .env.example a .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  bucket:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
             mc mb --ignore-existing local/mcs-documentos &&
             mc mb --ignore-existing local/mcs-certificados"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  # MongoDB de MS-09 (una base por servicio, RD-11) y el buzón de pruebas donde caen sus correos.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025"]

  migrar-identidad:
    <<: *migracion
    build: ./identidad
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/identidad
      USUARIO_DEMO_CLAVE: ${USUARIO_DEMO_CLAVE:?copia .env.example a .env}

  identidad:
    build: ./identidad
    restart: unless-stopped
    depends_on: { migrar-identidad: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/identidad
      # iss que ve el navegador; los servicios entran por la red interna (http://identidad:8080).
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      PORTAL_REDIRECTS: http://localhost:4173/*,http://localhost:5173/*
      ORIGENES: http://localhost:4173,http://localhost:5173
      KC_AFILIACION_SECRETO: ${KC_AFILIACION_SECRETO:?copia .env.example a .env}
      KC_INTEROP_SECRETO: ${KC_INTEROP_SECRETO:?copia .env.example a .env}
      KC_CUSTODIA_SECRETO: ${KC_CUSTODIA_SECRETO:?copia .env.example a .env}
    ports: ["8081:8080"]

  # Doble de GovCarpeta: compose nunca escribe en el real (B-06, GOVCARPETA_ESCRITURA).
  govcarpeta:
    build: ./infra/govcarpeta-stub
    restart: unless-stopped
    ports: ["8090:8080"]

  pasarela:
    build: ./servicios/pasarela
    restart: unless-stopped
    depends_on: { govcarpeta: { condition: service_healthy } }
    environment:
      GOVCARPETA_URL: ${GOVCARPETA_URL:-http://govcarpeta:8080}
      GOVCARPETA_ESCRITURA: ${GOVCARPETA_ESCRITURA:-0}
      OPERADOR_ID: ${OPERADOR_ID:-mcs-local}
      OPERADOR_NOMBRE: Mi Carpeta Segura
      # MinIO local no tiene TLS; en la nube la pasarela exige https.
      URL_SOLO_HTTPS: "false"
    ports: ["8084:8080"]

  migrar-afiliacion:
    <<: *migracion
    build: { context: ., dockerfile: servicios/afiliacion/Dockerfile }
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/afiliacion

  afiliacion:
    build: { context: ., dockerfile: servicios/afiliacion/Dockerfile }
    restart: unless-stopped
    depends_on:
      migrar-afiliacion: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
      pasarela: { condition: service_healthy }
      kafka: { condition: service_healthy }
      esquemas: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/afiliacion
      PASARELA_URL: http://pasarela:8080
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KEYCLOAK_URL: http://identidad:8080
      KEYCLOAK_SECRETO: ${KC_AFILIACION_SECRETO}
      # HU-09: rutas de servicio del traslado (token con audiencia afiliacion) y firma del enlace de activación.
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ACTIVACION_SECRETO: ${ACTIVACION_SECRETO:?copia .env.example a .env}
      # En local todas las pruebas salen de la misma IP; en la nube queda el valor por defecto (5).
      LIMITE_REGISTROS_HORA: 1000
      ORIGENES: http://localhost:4173,http://localhost:5173
    ports: ["8082:8080"]

  # MS-06: decide si un documento puede salir hacia un tercero según el consentimiento del titular (RI-08).
  migrar-autorizaciones:
    <<: *migracion
    build: ./servicios/autorizaciones
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/autorizaciones

  autorizaciones:
    build: ./servicios/autorizaciones
    restart: unless-stopped
    depends_on:
      migrar-autorizaciones: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/autorizaciones
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
      AUTORIZACION_HORAS: ${AUTORIZACION_HORAS:-72}
    ports: ["8093:8080"]

  migrar-custodia:
    <<: *migracion
    build: { context: ., dockerfile: servicios/custodia/Dockerfile }
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/custodia

  custodia:
    build: { context: ., dockerfile: servicios/custodia/Dockerfile }
    restart: unless-stopped
    depends_on:
      migrar-custodia: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
      bucket: { condition: service_completed_successfully }
      pasarela: { condition: service_healthy }
      kafka: { condition: service_healthy }
      esquemas: { condition: service_completed_successfully }
      autorizaciones: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/custodia
      PASARELA_URL: http://pasarela:8080
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AUTORIZACIONES_URL: http://autorizaciones:8080
      OIDC_INTERNO_URL: http://identidad:8080/realms/carpeta
      KC_CUSTODIA_SECRETO: ${KC_CUSTODIA_SECRETO}
      # HU-09: hosts internos desde los que la custodia acepta descargar un traslado (en la nube, solo https público).
      TRASLADO_HOSTS_INTERNOS: operador-origen
      # iss que ve el navegador; las llaves se leen por la red interna.
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
      S3_ENDPOINT: http://minio:9000
      # Las URL prefirmadas se firman con el host que ve el navegador.
      S3_ENDPOINT_PUBLICO: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: mcs-documentos
      S3_BUCKET_CERTIFICADOS: mcs-certificados
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["8083:8080"]

  # Entidad emisora simulada: firma y entrega certificados como lo haría una universidad (B-01).
  entidad:
    build: ./infra/entidad-simulada
    restart: unless-stopped
    environment:
      EMISOR: universidad-demo
      INTEROP_URL: http://interoperabilidad:8080
      ALMACEN_CONEXION: minio:9000
    ports: ["8088:8080"]

  # Otro operador de Carpeta Ciudadana simulado: traslada ciudadanos hacia el nuestro (HU-09), como la entidad hace con los certificados.
  operador-origen:
    build: ./infra/operador-origen
    restart: unless-stopped
    depends_on: { govcarpeta: { condition: service_healthy } }
    environment:
      OPERADOR: operador-origen
      OPERADOR_NOMBRE: Operador Origen
      INTEROP_URL: http://interoperabilidad:8080
      GOVCARPETA_URL: http://govcarpeta:8080
      URL_PUBLICA: http://operador-origen:8080
    ports: ["8094:8080"]

  migrar-interoperabilidad:
    <<: *migracion
    build: { context: ., dockerfile: servicios/interoperabilidad/Dockerfile }
    command: ["node", "src/server.js", "--migrar"]
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/interoperabilidad

  interoperabilidad:
    build: { context: ., dockerfile: servicios/interoperabilidad/Dockerfile }
    restart: unless-stopped
    depends_on:
      migrar-interoperabilidad: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      esquemas: { condition: service_completed_successfully }
      custodia: { condition: service_healthy }
      pasarela: { condition: service_healthy }
      autorizaciones: { condition: service_healthy }
      afiliacion: { condition: service_healthy }
      identidad: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      DATABASE_URL: postgres://postgres:${PG_CLAVE}@postgres/interoperabilidad
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PASARELA_URL: http://pasarela:8080
      CUSTODIA_URL: http://custodia:8080
      AUTORIZACIONES_URL: http://autorizaciones:8080
      AFILIACION_URL: http://afiliacion:8080
      SPA_URL: http://localhost:4173
      TRASLADO_HOSTS_INTERNOS: operador-origen
      OIDC_INTERNO_URL: http://identidad:8080/realms/carpeta
      KC_INTEROP_SECRETO: ${KC_INTEROP_SECRETO}
      # Directorio de entidades emisoras y su llave pública (id=urlJWKS;id=urlJWKS).
      EMISORES: universidad-demo=http://entidad:8080/.well-known/jwks.json;operador-origen=http://operador-origen:8080/.well-known/jwks.json
      # HU-08: correo a la entidad sin operador con enlaces que apuntan aquí (la URL que ve quien abre el correo).
      SMTP_URL: smtp://mailpit:1025
      ENLACES_URL: http://localhost:8086
      ENLACE_SECRETO: ${ENLACE_SECRETO:?copia .env.example a .env}
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
    ports: ["8086:8080"]

  notificaciones:
    build: { context: ., dockerfile: servicios/notificaciones/Dockerfile }
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      esquemas: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      MONGO_URL: mongodb://mongo:27017
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SMTP_URL: smtp://mailpit:1025
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
    ports: ["8087:8080"]

  # MS-05: índice de carpeta, una proyección en MongoDB alimentada por los eventos de documento.
  indice:
    build: { context: ., dockerfile: servicios/indice/Dockerfile }
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      esquemas: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
    environment:
      MONGO_URL: mongodb://mongo:27017
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
    ports: ["8091:8080"]

  # MS-02: bitácora de accesos solo-append en MongoDB, alimentada por los eventos de acceso.
  auditoria:
    build: { context: ., dockerfile: servicios/auditoria/Dockerfile }
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      esquemas: { condition: service_completed_successfully }
      identidad: { condition: service_healthy }
    environment:
      MONGO_URL: mongodb://mongo:27017
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OIDC_ISSUER: http://localhost:8081/realms/carpeta
      OIDC_JWKS_URL: http://identidad:8080/realms/carpeta/protocol/openid-connect/certs
      ORIGENES: http://localhost:4173,http://localhost:5173
    ports: ["8092:8080"]

  web:
    build:
      context: ./web
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/carpeta
        VITE_MCS_AFILIACION: http://localhost:8082
        VITE_MCS_CUSTODIA: http://localhost:8083
        VITE_MCS_NOTIFICACIONES: http://localhost:8087
        VITE_MCS_INDICE: http://localhost:8091
        VITE_MCS_AUDITORIA: http://localhost:8092
        VITE_MCS_AUTORIZACIONES: http://localhost:8093
        VITE_MCS_INTEROPERABILIDAD: http://localhost:8086
    restart: unless-stopped
    depends_on: { identidad: { condition: service_healthy } }
    ports: ["4173:80"]

volumes:
  pgdata:
  miniodata:
  mongodata:
