# SPA estática en GitHub Pages (AD-11). Las URL de los servicios salen de las variables del repositorio (Settings > Variables),
# que se copian de `terraform output urls` tras el despliegue. Sin secretos: la SPA es pública.
name: pages
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_MCS_AFILIACION: ${{ vars.VITE_MCS_AFILIACION }}
          VITE_MCS_CUSTODIA: ${{ vars.VITE_MCS_CUSTODIA }}
          VITE_MCS_NOTIFICACIONES: ${{ vars.VITE_MCS_NOTIFICACIONES }}
          VITE_MCS_INDICE: ${{ vars.VITE_MCS_INDICE }}
          VITE_MCS_AUDITORIA: ${{ vars.VITE_MCS_AUDITORIA }}
          VITE_MCS_ANALITICA: ${{ vars.VITE_MCS_ANALITICA }}
          VITE_MCS_AUTORIZACIONES: ${{ vars.VITE_MCS_AUTORIZACIONES }}
          VITE_MCS_INTEROPERABILIDAD: ${{ vars.VITE_MCS_INTEROPERABILIDAD }}
          VITE_MCS_PREMIUM: ${{ vars.VITE_MCS_PREMIUM }}
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
